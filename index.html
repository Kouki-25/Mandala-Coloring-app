<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- منع الزوم والتمدد والسحب الجانبي نهائياً لضمان تجربة 2D حقيقية -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mandala Adult Coloring</title>
  <style>
    /* إعادة ضبط جميع القياسات لتعمل على حجم الشاشة بدقة 100% */
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    /* الحاوي الرئيسي للتطبيق */
    #app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    /* شريط اختيار المستويات والأدوات العلوية */
    .header-bar {
      width: 100%;
      padding: 10px 15px;
      background-color: #2b2b2b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .header-title {
      font-size: 16px;
      font-weight: bold;
      color: #e0e0e0;
    }

    .level-select {
      background-color: #3d3d3d;
      color: white;
      border: 1px solid #555;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    /* منطقة رسم الـ Canvas */
    #canvas-container {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #121212;
      padding: 10px;
    }

    canvas {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      touch-action: none;
      display: block;
    }

    /* لوحة الألوان والأزرار السفلية */
    .controls-panel {
      width: 100%;
      background-color: #2b2b2b;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.5);
      z-index: 10;
    }

    /* شريط الألوان الأفقي مع إمكانية التمرير بمرونة */
    .color-palette {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 5px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }

    .color-palette::-webkit-scrollbar {
      display: none;
    }

    .color-swatch {
      min-width: 38px;
      min-height: 38px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #444;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .color-swatch.active {
      transform: scale(1.18);
      border: 3px solid #ffffff;
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
    }

    /* شريط الأزرار الرئيسية */
    .action-buttons {
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #3b82f6;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
      touch-action: manipulation;
    }

    .btn:active {
      background-color: #1d4ed8;
      transform: scale(0.98);
    }

    .btn-danger {
      background-color: #ef4444;
    }

    .btn-danger:active {
      background-color: #b91c1c;
    }

    .btn-success {
      background-color: #10b981;
    }

    .btn-success:active {
      background-color: #047857;
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- الشريط العلوي -->
  <div class="header-bar">
    <div class="header-title">تلوين ماندالا الكبار</div>
    <select id="levelSelect" class="level-select">
      <option value="1">المستوى 1: ماندالا زهرية</option>
      <option value="2">المستوى 2: ماندالا النجمة</option>
      <option value="3">المستوى 3: الهندسة المركبة</option>
    </select>
  </div>

  <!-- حاوي اللوحة -->
  <div id="canvas-container">
    <canvas id="mandalaCanvas"></canvas>
  </div>

  <!-- لوحة التحكم والألوان السفلية -->
  <div class="controls-panel">
    <!-- قائمة الألوان -->
    <div class="color-palette" id="colorPalette">
      <!-- يتم توليد الألوان عبر JS -->
    </div>

    <!-- أزرار الإجراءات -->
    <div class="action-buttons">
      <button class="btn btn-danger" id="clearBtn">
        <span>إعادة رسم</span>
      </button>
      <button class="btn btn-success" id="saveBtn">
        <span>حفظ الصورة</span>
      </button>
    </div>
  </div>
</div>

<script>
  // قائمة الألوان المتاحة للتلوين
  const colors = [
    '#EF4444', '#F97316', '#F59E0B', '#10B981', '#06B6D4',
    '#3B82F6', '#6366F1', '#8B5CF6', '#EC4899', '#F43F5E',
    '#111827', '#6B7280', '#D1D5DB', '#FFFFFF', '#84CC16'
  ];

  let selectedColor = colors[0];
  let currentLevel = '1';

  const canvas = document.getElementById('mandalaCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const canvasContainer = document.getElementById('canvas-container');
  const levelSelect = document.getElementById('levelSelect');

  // إعداد لوحة الألوان
  function initPalette() {
    const palette = document.getElementById('colorPalette');
    palette.innerHTML = '';
    colors.forEach((color, index) => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch' + (index === 0 ? ' active' : '');
      swatch.style.backgroundColor = color;
      swatch.addEventListener('click', () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        selectedColor = color;
      });
      palette.appendChild(swatch);
    });
  }

  // ضبط أبعاد اللوحة تلقائياً تناسب الشاشة 100%
  function fitCanvasToScreen() {
    const containerWidth = canvasContainer.clientWidth - 20;
    const containerHeight = canvasContainer.clientHeight - 20;
    const size = Math.floor(Math.min(containerWidth, containerHeight));

    canvas.width = size;
    canvas.height = size;

    drawMandala(currentLevel);
  }

  // رسم أشكال الماندالا المختلفة
  function drawMandala(level) {
    const w = canvas.width;
    const h = canvas.height;
    const cx = w / 2;
    const cy = h / 2;
    const maxRadius = Math.min(w, h) * 0.45;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = '#000000';
    ctx.lineWidth = Math.max(1.5, w / 200);
    ctx.lineCap = 'round';

    if (level === '1') {
      // مستوى 1: ماندالا الزهرة
      const petals = 12;
      for (let r = maxRadius; r > 20; r -= maxRadius / 5) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      for (let i = 0; i < petals; i++) {
        const angle = (i * 2 * Math.PI) / petals;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * maxRadius, cy + Math.sin(angle) * maxRadius);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx + Math.cos(angle) * (maxRadius * 0.6), cy + Math.sin(angle) * (maxRadius * 0.6), maxRadius * 0.2, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (level === '2') {
      // مستوى 2: ماندالا النجمة
      const points = 16;
      for (let i = 0; i < points; i++) {
        const angle = (i * 2 * Math.PI) / points;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * maxRadius, cy + Math.sin(angle) * maxRadius);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx + Math.cos(angle) * (maxRadius * 0.5), cy + Math.sin(angle) * (maxRadius * 0.5), maxRadius * 0.25, 0, Math.PI * 2);
        ctx.stroke();
      }
      for (let r = maxRadius; r > 30; r -= maxRadius / 4) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else {
      // مستوى 3: ماندالا هندسية معقدة
      const sectors = 24;
      for (let r = maxRadius; r > 15; r -= maxRadius / 7) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      for (let i = 0; i < sectors; i++) {
        const angle = (i * 2 * Math.PI) / sectors;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * maxRadius, cy + Math.sin(angle) * maxRadius);
        ctx.stroke();
      }
    }
  }

  // خوارزمية التعبئة باللمس (Flood Fill Algorithm)
  function floodFill(startX, startY, fillColorHex) {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    function hexToRgb(hex) {
      const c = parseInt(hex.replace('#', ''), 16);
      return [(c >> 16) & 255, (c >> 8) & 255, c & 255, 255];
    }

    const fillColor = hexToRgb(fillColorHex);
    const targetPos = (startY * canvas.width + startX) * 4;
    const startR = data[targetPos];
    const startG = data[targetPos + 1];
    const startB = data[targetPos + 2];
    const startA = data[targetPos + 3];

    // عدم التعبئة إذا كان اللون المختار هو نفس اللون الحالي أو خط أسود للحدود
    if (startR === fillColor[0] && startG === fillColor[1] && startB === fillColor[2]) return;
    if (startR < 50 && startG < 50 && startB < 50) return; // منع تعبئة الخطوط السوداء

    const pixelsToCheck = [startX, startY];
    const width = canvas.width;
    const height = canvas.height;

    function matchStartColor(pos) {
      const r = data[pos];
      const g = data[pos + 1];
      const b = data[pos + 2];
      const a = data[pos + 3];
      return Math.abs(r - startR) < 30 && Math.abs(g - startG) < 30 && Math.abs(b - startB) < 30 && Math.abs(a - startA) < 30;
    }

    while (pixelsToCheck.length > 0) {
      const y = pixelsToCheck.pop();
      const x = pixelsToCheck.pop();

      let pos = (y * width + x) * 4;

      while (y >= 0 && matchStartColor(pos)) {
        pos -= width * 4;
      }
      pos += width * 4;

      let matchLeft = false;
      let matchRight = false;

      while (y < height && matchStartColor(pos)) {
        data[pos] = fillColor[0];
        data[pos + 1] = fillColor[1];
        data[pos + 2] = fillColor[2];
        data[pos + 3] = 255;

        if (x > 0) {
          if (matchStartColor(pos - 4)) {
            if (!matchLeft) {
              pixelsToCheck.push(x - 1, y);
              matchLeft = true;
            }
          } else if (matchLeft) {
            matchLeft = false;
          }
        }

        if (x < width - 1) {
          if (matchStartColor(pos + 4)) {
            if (!matchRight) {
              pixelsToCheck.push(x + 1, y);
              matchRight = true;
            }
          } else if (matchRight) {
            matchRight = false;
          }
        }

        pos += width * 4;
        y++;
      }
    }

    ctx.putImageData(imageData, 0, 0);
  }

  // معالجة اللمس والضغط المباشر
  function handlePointer(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    const x = Math.floor((clientX - rect.left) * (canvas.width / rect.width));
    const y = Math.floor((clientY - rect.top) * (canvas.height / rect.height));

    if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height) {
      floodFill(x, y, selectedColor);
    }
  }

  // إضافة الاستماع لأحداث اللمس
  canvas.addEventListener('touchstart', handlePointer, { passive: false });
  canvas.addEventListener('click', handlePointer);

  // إعادة ضبط ومسح الرسمة
  document.getElementById('clearBtn').addEventListener('click', () => {
    drawMandala(currentLevel);
  });

  // اختيار المستوى
  levelSelect.addEventListener('change', (e) => {
    currentLevel = e.target.value;
    drawMandala(currentLevel);
  });

  // حفظ الصورة
  document.getElementById('saveBtn').addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'mandala-coloring.png';
    link.href = canvas.toDataURL();
    link.click();
  });

  // ضبط أبعاد النافذة عند الفتح والتغيير
  window.addEventListener('resize', fitCanvasToScreen);
  window.addEventListener('orientationchange', fitCanvasToScreen);

  // تشغيل التطبيق أول مرة
  initPalette();
  setTimeout(fitCanvasToScreen, 100);
</script>

</body>
</html>
