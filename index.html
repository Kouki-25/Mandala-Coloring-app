<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- ضبط أبعاد الشاشة 2D ومنع التكبير والتمرير -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mandala Coloring</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden; /* يمنع ظهور السحب الجانبي والعناصر الخارجية */
      touch-action: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
    }

    #app-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* الواجهة الافتتاحية (Splash Screen) */
    #splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #2c3e50, #4ca1af);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
      text-align: center;
    }

    #splash-screen h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    #splash-screen p {
      font-size: 16px;
      color: #e0e0e0;
      margin-bottom: 30px;
    }

    .start-btn {
      padding: 14px 40px;
      font-size: 18px;
      font-weight: bold;
      background-color: #ff4757;
      color: white;
      border: none;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
      cursor: pointer;
      touch-action: manipulation;
    }

    .start-btn:active {
      transform: scale(0.95);
      background-color: #ff6b81;
    }

    /* شاشة اللعبة الرئيسية */
    #game-screen {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .header-bar {
      width: 100%;
      padding: 10px 15px;
      background-color: #2b2b2b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .header-title {
      font-size: 16px;
      font-weight: bold;
    }

    .level-select {
      background-color: #3d3d3d;
      color: white;
      border: 1px solid #555;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    #canvas-container {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #121212;
      padding: 10px;
    }

    canvas {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      touch-action: none;
      display: block;
    }

    .controls-panel {
      width: 100%;
      background-color: #2b2b2b;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .color-palette {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 5px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }

    .color-palette::-webkit-scrollbar {
      display: none;
    }

    .color-swatch {
      min-width: 38px;
      min-height: 38px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #444;
      cursor: pointer;
      flex-shrink: 0;
    }

    .color-swatch.active {
      transform: scale(1.18);
      border: 3px solid #ffffff;
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
    }

    .action-buttons {
      display: flex;
      justify-content: space-around;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background-color: #3b82f6;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }

    .btn-danger { background-color: #ef4444; }
    .btn-success { background-color: #10b981; }
  </style>
</head>
<body>

<div id="app-container">
  <!-- الواجهة الافتتاحية -->
  <div id="splash-screen">
    <h1>تلوين ماندالا الكبار</h1>
    <p>استمتع بتجربة تلوين مريحة ومحفزة للإبداع</p>
    <button class="start-btn" id="startBtn">بدء اللعب</button>
  </div>

  <!-- الشاشة الرئيسية -->
  <div id="game-screen">
    <div class="header-bar">
      <div class="header-title">تلوين ماندالا</div>
      <select id="levelSelect" class="level-select">
        <option value="1">المستوى 1: زهرية</option>
        <option value="2">المستوى 2: النجمة</option>
        <option value="3">المستوى 3: معقدة</option>
      </select>
    </div>

    <div id="canvas-container">
      <canvas id="mandalaCanvas"></canvas>
    </div>

    <div class="controls-panel">
      <div class="color-palette" id="colorPalette"></div>
      <div class="action-buttons">
        <button class="btn btn-danger" id="clearBtn">إعادة رسم</button>
        <button class="btn btn-success" id="saveBtn">حفظ الصورة</button>
      </div>
    </div>
  </div>
</div>

<script>
  const colors = [
    '#EF4444', '#F97316', '#F59E0B', '#10B981', '#06B6D4',
    '#3B82F6', '#6366F1', '#8B5CF6', '#EC4899', '#F43F5E',
    '#111827', '#6B7280', '#D1D5DB', '#FFFFFF'
  ];

  let selectedColor = colors[0];
  let currentLevel = '1';

  const canvas = document.getElementById('mandalaCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const canvasContainer = document.getElementById('canvas-container');

  // الاستجابة الفورية للمس والنقر
  function addTouchAndClickListener(element, callback) {
    if (!element) return;
    element.addEventListener('touchend', function(e) {
      e.preventDefault();
      callback(e);
    }, { passive: false });
    element.addEventListener('click', function(e) {
      callback(e);
    });
  }

  // بدء اللعب وتحويل الشاشة
  const startBtn = document.getElementById('startBtn');
  addTouchAndClickListener(startBtn, function() {
    document.getElementById('splash-screen').style.display = 'none';
    const gameScreen = document.getElementById('game-screen');
    gameScreen.style.display = 'flex';
    fitCanvasToScreen();
  });

  function initPalette() {
    const palette = document.getElementById('colorPalette');
    palette.innerHTML = '';
    colors.forEach((color, index) => {
      const swatch = document.createElement('div');
      swatch.className = 'color-swatch' + (index === 0 ? ' active' : '');
      swatch.style.backgroundColor = color;
      addTouchAndClickListener(swatch, () => {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        selectedColor = color;
      });
      palette.appendChild(swatch);
    });
  }

  function fitCanvasToScreen() {
    const containerWidth = canvasContainer.clientWidth - 20;
    const containerHeight = canvasContainer.clientHeight - 20;
    const size = Math.floor(Math.min(containerWidth, containerHeight));

    if (size > 0) {
      canvas.width = size;
      canvas.height = size;
      drawMandala(currentLevel);
    }
  }

  function drawMandala(level) {
    const w = canvas.width;
    const h = canvas.height;
    const cx = w / 2;
    const cy = h / 2;
    const maxRadius = Math.min(w, h) * 0.45;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = Math.max(1.5, w / 200);

    const petals = level === '1' ? 12 : level === '2' ? 16 : 24;
    for (let r = maxRadius; r > 20; r -= maxRadius / 5) {
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    for (let i = 0; i < petals; i++) {
      const angle = (i * 2 * Math.PI) / petals;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(angle) * maxRadius, cy + Math.sin(angle) * maxRadius);
      ctx.stroke();
    }
  }

  function floodFill(startX, startY, fillColorHex) {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    function hexToRgb(hex) {
      const c = parseInt(hex.replace('#', ''), 16);
      return [(c >> 16) & 255, (c >> 8) & 255, c & 255, 255];
    }

    const fillColor = hexToRgb(fillColorHex);
    const targetPos = (startY * canvas.width + startX) * 4;
    const startR = data[targetPos], startG = data[targetPos + 1], startB = data[targetPos + 2];

    if (startR < 50 && startG < 50 && startB < 50) return;

    const pixelsToCheck = [startX, startY];
    const width = canvas.width, height = canvas.height;

    while (pixelsToCheck.length > 0) {
      const y = pixelsToCheck.pop();
      const x = pixelsToCheck.pop();
      let pos = (y * width + x) * 4;

      if (data[pos] === startR && data[pos + 1] === startG && data[pos + 2] === startB) {
        data[pos] = fillColor[0];
        data[pos + 1] = fillColor[1];
        data[pos + 2] = fillColor[2];
        data[pos + 3] = 255;

        if (x > 0) pixelsToCheck.push(x - 1, y);
        if (x < width - 1) pixelsToCheck.push(x + 1, y);
        if (y > 0) pixelsToCheck.push(x, y - 1);
        if (y < height - 1) pixelsToCheck.push(x, y + 1);
      }
    }
    ctx.putImageData(imageData, 0, 0);
  }

  function handlePointer(e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    const x = Math.floor((clientX - rect.left) * (canvas.width / rect.width));
    const y = Math.floor((clientY - rect.top) * (canvas.height / rect.height));

    if (x >= 0 && x < canvas.width && y >= 0 && y < canvas.height) {
      floodFill(x, y, selectedColor);
    }
  }

  canvas.addEventListener('touchstart', handlePointer, { passive: false });
  canvas.addEventListener('click', handlePointer);

  document.getElementById('clearBtn').addEventListener('click', () => drawMandala(currentLevel));
  document.getElementById('levelSelect').addEventListener('change', (e) => {
    currentLevel = e.target.value;
    drawMandala(currentLevel);
  });

  window.addEventListener('resize', fitCanvasToScreen);
  initPalette();
</script>

</body>
</html>
